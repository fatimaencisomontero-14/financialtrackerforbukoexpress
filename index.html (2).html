
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Finance Tracker</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 25px;
    background: #f4f6f9;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    color: #203b35;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 25px 0;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #00000010;
}

.card p {
    color: #777;
    margin-bottom: 8px;
}

.card h2 {
    margin: 0;
}

.income { color: #159957; }
.expense { color: #dc4545; }
.balance { color: #245cba; }

.form {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 7px;
}

button {
    background: #203b35;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #315a50;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #203b35;
    color: white;
}

.delete {
    background: #dc4545;
    padding: 7px;
}

.history {
    overflow-x: auto;
}

@media(max-width:650px) {
    .summary {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Financial Tracker</h1>
<p>Monitor your money. Manage your future.</p>

<div class="summary">

<div class="card">
<p>Total Income</p>
<h2 class="income" id="totalIncome">₱0.00</h2>
</div>

<div class="card">
<p>Total Expenses</p>
<h2 class="expense" id="totalExpense">₱0.00</h2>
</div>

<div class="card">
<p>Available Balance</p>
<h2 class="balance" id="balance">₱0.00</h2>
</div>

</div>

<div class="form">

<h2>Add Transaction</h2>

<input type="date" id="date">

<select id="type">
<option value="Income">Income</option>
<option value="Expense">Expense</option>
</select>

<input type="text" id="description"
placeholder="Transaction description">

<select id="category">
<option value="Salary">Salary</option>
<option value="Freelance">Freelance</option>
<option value="Business">Business</option>
<option value="Food">Food</option>
<option value="Rent">Rent</option>
<option value="Utilities">Utilities</option>
<option value="Transportation">Transportation</option>
<option value="Debt">Debt Payment</option>
<option value="Savings">Savings</option>
<option value="Other">Other</option>
</select>

<input type="number" id="amount"
placeholder="Amount (₱)" min="0.01" step="0.01">

<button onclick="addTransaction()">
Add Transaction
</button>

</div>

<div class="history">

<h2>Transaction History</h2>

<select id="filter" onchange="render()">
<option value="All">All Transactions</option>
<option value="Income">Income Only</option>
<option value="Expense">Expenses Only</option>
</select>

<table>
<thead>
<tr>
<th>Date</th>
<th>Description</th>
<th>Category</th>
<th>Type</th>
<th>Amount</th>
<th>Action</th>
</tr>
</thead>
<tbody id="transactionList"></tbody>
</table>

</div>
</div>

<script>

let transactions = JSON.parse(
    localStorage.getItem("transactions") || "[]"
);

const peso = amount =>
    "₱" + amount.toLocaleString("en-PH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

function addTransaction() {

    const date = document.getElementById("date").value;
    const type = document.getElementById("type").value;
    const description =
        document.getElementById("description").value.trim();
    const category =
        document.getElementById("category").value;
    const amount = Number(
        document.getElementById("amount").value
    );

    if (!date || !description || !Number.isFinite(amount)
        || amount <= 0) {
        alert("Please complete all fields with a valid amount.");
        return;
    }

    transactions.push({
        id: crypto.randomUUID(),
        date,
        type,
        description,
        category,
        amount
    });

    save();
    render();

    document.getElementById("description").value = "";
    document.getElementById("amount").value = "";
}

function save() {
    localStorage.setItem(
        "transactions",
        JSON.stringify(transactions)
    );
}

function deleteTransaction(id) {

    if (!confirm("Delete this transaction?")) return;

    transactions = transactions.filter(
        transaction => transaction.id !== id
    );

    save();
    render();
}

function render() {

    const income = transactions
        .filter(t => t.type === "Income")
        .reduce((sum, t) => sum + t.amount, 0);

    const expenses = transactions
        .filter(t => t.type === "Expense")
        .reduce((sum, t) => sum + t.amount, 0);

    document.getElementById("totalIncome").textContent =
        peso(income);

    document.getElementById("totalExpense").textContent =
        peso(expenses);

    document.getElementById("balance").textContent =
        peso(income - expenses);

    const filter = document.getElementById("filter").value;

    const filtered = transactions
        .filter(t => filter === "All" || t.type === filter)
        .sort((a, b) => b.date.localeCompare(a.date));

    const list = document.getElementById("transactionList");

    list.innerHTML = "";

    filtered.forEach(t => {

        const row = document.createElement("tr");

        const values = [
            t.date,
            t.description,
            t.category,
            t.type,
            (t.type === "Income" ? "+" : "-") + peso(t.amount)
        ];

        values.forEach((value, index) => {
            const cell = document.createElement("td");
            cell.textContent = value;

            if (index === 3) {
                cell.style.color =
                    t.type === "Income" ? "green" : "red";
            }

            row.appendChild(cell);
        });

        const action = document.createElement("td");
        const button = document.createElement("button");

        button.textContent = "Delete";
        button.className = "delete";
        button.onclick = () => deleteTransaction(t.id);

        action.appendChild(button);
        row.appendChild(action);
        list.appendChild(row);
    });
}

document.getElementById("date").value =
    new Date().toLocaleDateString("en-CA");

render();

</script>

</body>
</html>
